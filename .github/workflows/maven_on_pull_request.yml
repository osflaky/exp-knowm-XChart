# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI with Maven on Pull Request

on:
  workflow_dispatch:

jobs:
  build:

    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-latest
          arch: arm64
          runner: macos-latest
          expander_leg: macos-latest--arm64
    runs-on: ${{ matrix.runner }}

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: ${{ matrix.distribution || 'temurin' }}
        architecture: ${{ matrix.arch }}
        cache: maven
    - name: Build with Maven
      shell: bash
      run: mvn clean verify --no-transfer-progress --batch-mode --settings 
        etc/settings.xml -Dmaven.javadoc.skip=true -Dfmt.skip=true ${{ 
        matrix.mvn_args }};
    name: build [${{ matrix.expander_leg }}]
    timeout-minutes: 150
